server:
  port: 8011

rabbitmq:
  messaging:
    exchange: wallet.exchange
    queue: wallet.auth.user.created.queue
    profile-queue: profile.wallet.created.queue
    rollback-queue-profile: wallet.profile.kyc.rollback.queue
    routing-key: wallet.created
    rollback-queue: auth.user.rollback.queue
    rollback-routing-key: auth.user.rollback
    transaction-exchange: transaction.exchange
    transaction-wallet-queue: wallet.fraud.check.passed.queue
    transaction-routing-key: transaction.fraud.check.passed
    transaction-rollback-routing-key: transaction.wallet.processed
    audit-exchange: audit.exchange
    audit-queue: audit.log.created.queue
    audit-routing-key: audit.log.created

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/wallet_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq-server}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://discovery-service:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
