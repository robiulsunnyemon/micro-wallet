server:
  port: 8200

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: ${JWT_EXPIRATION:36000000}

spring:
  http:
    codecs:
      max-in-memory-size: 50MB
  cloud:
    gateway:
      server:
        webflux:
          streaming-media-types:
            - multipart/form-data
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/auth/**
            - id: auth-service-internal
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/internal/**
            - id: wallet-service
              uri: lb://WALLET-SERVICE
              predicates:
                - Path=/api/v1/wallets/**
              filters:
                - AuthenticationFilter
            - id: profile-service
              uri: lb://PROFILE-SERVICE
              predicates:
                - Path=/api/v1/profiles/**
              filters:
                - AuthenticationFilter
            - id: transaction-service
              uri: lb://TRANSACTION-SERVICE
              predicates:
                - Path=/api/v1/transactions/**
              filters:
                - AuthenticationFilter
            - id: audit-service
              uri: lb://AUDIT-SERVICE
              predicates:
                - Path=/api/v1/audit/**
              filters:
                - AuthenticationFilter

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://discovery-service:8761/eureka/}
  instance:
    prefer-ip-address: true
