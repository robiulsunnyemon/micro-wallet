server:
  port: 8012

rabbitmq:
  messaging:
    exchange: transaction.exchange
    routing-key: transaction.fraud.check.requested
    rollback-queue: transaction.wallet.processed.queue
    rollback-routing-key: transaction.wallet.processed
    fraud-rollback-queue: transaction.fraud.processed.queue
    audit-exchange: audit.exchange
    audit-queue: audit.log.created.queue
    audit-routing-key: audit.log.created

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/transaction}
    username: ${CORE_DB_USER}
    password: ${CORE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq-server}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${RMQ_USER:guest}
    password: ${RMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://discovery-service:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true