server:
  port: 8087


rabbitmq:
  queue: profile.queue
  exchange: profile.exchange
  rollback-queue: profile.created
  routing-key-rollback: profile.created.rollback

spring:
  application:
    name: profile-service
  datasource:
    url: jdbc:postgresql://localhost:5432/profile_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true